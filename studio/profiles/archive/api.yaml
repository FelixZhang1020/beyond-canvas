# Fixed API-only deployment. No 4090 or Mac model dependency.
#
# Every step-3.7-flash slot below carries the same price pair, and it is not
# decoration: StepFun returns no cost field, so a ledger line's `cost` is computed
# from these. The list is ¥1.35 in / ¥8.1 out per million (platform.stepfun.com,
# read off its price page); at 7.1 CNY to the USD that is 0.19 / 1.14, the pair cloud.yaml
# already carried. Leave them out and the provider records 0.0 — which the ledger
# then shows as free rather than as unpriced, which is how every earlier class run
# came to report spending nothing at all.
slots:
  vlm.studio:
    provider: stepfun
    model: step-3.7-flash
    options:
      reasoning_effort: low
      max_tokens: 12000
      price_usd_per_m_in: 0.19
      price_usd_per_m_out: 1.14
  vlm.director:
    provider: stepfun
    model: step-3.7-flash
    options:
      reasoning_effort: high
      max_tokens: 16000
      price_usd_per_m_in: 0.19
      price_usd_per_m_out: 1.14
  safety.image:
    provider: stepfun
    model: step-3.7-flash
    options:
      reasoning_effort: high
      max_tokens: 16000
      price_usd_per_m_in: 0.19
      price_usd_per_m_out: 1.14
  vlm.sketch:
    provider: stepfun
    model: step-3.7-flash
    options:
      reasoning_effort: medium
      max_tokens: 12000
      price_usd_per_m_in: 0.19
      price_usd_per_m_out: 1.14
  vlm.creation:
    provider: stepfun
    model: step-3.7-flash
    options:
      reasoning_effort: medium
      max_tokens: 12000
      price_usd_per_m_in: 0.19
      price_usd_per_m_out: 1.14
  vlm.teacher:
    provider: stepfun
    model: step-3.7-flash
    options:
      # medium, not high: once one report call at high spent all
      # 16000 completion tokens on hidden reasoning and returned no text
      # (ledger note, 196 s). Good runs at high used 10-19k tokens across the
      # three calls, so the budget is not the problem; the thinking is.
      reasoning_effort: medium
      max_tokens: 16000
      price_usd_per_m_in: 0.19
      price_usd_per_m_out: 1.14
  image.edit:
    provider: replicate
    model: black-forest-labs/flux-2-klein-4b
    options:
      task: edit_image
      official: true
      fields:
        image: images
        instruction: prompt
      array_fields:
      - image
      extra:
        go_fast: false
        seed: 42
        aspect_ratio: match_input_image
        output_megapixels: '1'
        output_format: png
      choice: flux
      label: FLUX.2 Klein 4B
      timeout_s: 300
  video.animation:
    provider: replicate
    model: wan-video/wan-2.2-i2v-a14b
    options:
      official: true
      task: to_video
      fields:
        image: image
        instruction: prompt
      extra:
        seed: 42
        num_frames: 81
        resolution: 480p
        frames_per_second: 24
        sample_steps: 30
        go_fast: false
      # 900, not 600: one clip measured 631 s wall and cleared the old
      # ceiling by under thirty seconds. The page tells the teacher to expect about
      # five minutes; it takes ten. A ceiling a normal run brushes against throws a
      # paid job away on a slow day. The mesh route already allows 900.
      timeout_s: 900
  mesh.portrait:
    provider: cloudmesh
    model: trellis2
    options:
      task: to_mesh
  mesh.alternative:
    provider: cloudmesh
    model: pixal
    options:
      task: to_mesh
      choice: pixal
  tts.studio:
    provider: stepfun
    model: stepaudio-2.5-tts
    options:
      task: speak
      endpoint: audio/speech
      fields:
        text: input
        voice: voice
      extra:
        voice: wenrounvsheng
        instruction: 像幼儿园美术老师一样说话：温柔、慢一点、带着笑意，像在跟五岁的小朋友聊天
        response_format: mp3
        speed: 0.95
      price_usd: 0.0025
      timeout_s: 120

  # Bought, like everything else here — this deployment owns no hardware, and
  # that includes hearing. It is one of the two places a child's recorded voice
  # goes to a company; only local-first keeps it on hardware you own. Operator
  # decision, against the sentence it reverses: this product used to
  # promise a recording would never go to another computer at all. The whole note
  # is in studio/providers/stepfun_asr.py.
  #
  # It also means this option needs nothing running locally, which is what makes
  # it the one that still works when the 4090 is out of reach.
  speech.in:
    provider: stepfun
    model: stepaudio-2.5-asr
    options:
      task: transcribe
      endpoint: audio/transcriptions
