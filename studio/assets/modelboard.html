<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!-- Legacy blocked port: {requested} -->
<title>组件监控 · Beyond Canvas</title>
<script>if(window.self!==window.top)document.documentElement.classList.add('embedded');</script>
<style>
:root{{color-scheme:light;--bg:#F7F3EC;--panel:#fffdf9;--line:#e7dfd4;--muted:#7E7065;--text:#403832;--green:#647d59;--blue:#76668F;--amber:#aa7340;--page-frame:min(1600px,calc(100% - 64px))}}*{{box-sizing:border-box}}body{{margin:0;background:radial-gradient(ellipse at 0 0,#f7e5dc80,transparent 48%),var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}}button{{font:inherit;cursor:pointer}}main{{max-width:var(--page-frame);margin:auto;padding:36px 34px 44px}}.top{{display:flex;justify-content:space-between;align-items:center;gap:20px}}.eyebrow{{color:#B95741;font-size:13px;display:flex;align-items:center;gap:9px}}h1{{font-size:30px;margin:8px 0 4px;letter-spacing:-.03em}}p{{margin:0;color:var(--muted)}}.controls{{display:flex;flex-direction:column;align-items:flex-end;gap:8px}}.refresh{{background:#ffffff99;border:1px solid var(--line);border-radius:12px;padding:9px 15px;color:#6D6057}}.refresh:hover{{background:#fff}}.refresh:disabled{{opacity:.6}}#pulse{{font-size:11px;color:var(--muted)}}.stats{{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0 32px}}.stat{{border:1px solid var(--line);background:#fffcf7b3;border-radius:18px;padding:18px}}.statlabel{{font-size:12px;color:#6D6057;display:flex;align-items:center;gap:8px}}.value{{font-size:30px;font-weight:600;line-height:1.4;margin:9px 0 3px}}.value small{{font-size:12px;font-weight:400;margin-left:7px;color:var(--muted)}}.statfoot{{font-size:11px;color:var(--muted)}}.green{{color:var(--green)}}.amber{{color:var(--amber)}}.sectionhead{{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px}}h2{{font-size:18px;margin:0}}.micro{{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}}.filters{{display:flex;gap:4px;flex-wrap:wrap;background:#ede7df80;padding:4px;border-radius:12px}}.filter{{border:0;background:none;color:var(--muted);border-radius:9px;padding:7px 12px;font-size:12px}}.filter.selected{{background:#fffdf9;color:#B95741;box-shadow:0 1px 5px #58453712}}.cards{{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}.card{{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:23px;min-width:0;box-shadow:0 4px 18px #5a423004}}.cardtop{{display:flex;align-items:center;justify-content:space-between;gap:8px}}.icon{{width:49px;height:49px;border-radius:16px;display:grid;place-items:center;background:#f5e5dd;color:#B95741}}.card:nth-child(3n+2) .icon{{background:#eee8f4;color:#76668F}}.card:nth-child(3n) .icon{{background:#eaf0e4;color:#647d59}}.icon svg{{width:25px;height:25px}}.status{{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#76668F;background:#f1edf6;border-radius:99px;padding:5px 9px}}.status.ok{{color:#56714e;background:#edf3e8}}.status.off{{color:#9a693b;background:#fbf0e2}}.status.saved{{color:#827971;background:#f0ede8}}.card h3{{font-size:17px;margin:16px 0 6px}}.purpose{{font-size:13px;color:#7E7065;min-height:42px}}.cardmeta{{font-size:11px;color:#8c8076;margin-top:16px}}details{{border-top:1px solid #eee7df;margin-top:15px;padding-top:12px;font-size:12px;color:var(--muted)}}summary{{cursor:pointer;list-style:none}}summary::after{{content:'＋';float:right}}details[open] summary::after{{content:'−'}}details p{{margin-top:8px;overflow-wrap:anywhere}}.model,.resource{{font-size:11px;overflow-wrap:anywhere;margin-top:9px}}.foot{{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}}.empty{{padding:30px;color:var(--muted)}}.error{{color:var(--amber)!important}}svg{{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}}button:focus-visible,summary:focus-visible{{outline:2px solid #B95741;outline-offset:4px}}@media(min-width:1380px){{.cards{{grid-template-columns:repeat(4,minmax(0,1fr))}}}}@media(max-width:950px){{.cards{{grid-template-columns:repeat(2,minmax(0,1fr))}}}}@media(max-width:600px){{main{{padding:24px 16px}}.stats{{grid-template-columns:repeat(2,1fr);gap:10px}}.stat{{padding:15px}}.cards{{gap:10px}}.card{{padding:16px}}.sectionhead{{align-items:flex-start;flex-direction:column}}.cardtop{{align-items:flex-start;flex-direction:column;gap:10px}}h1{{font-size:26px}}.top{{align-items:flex-start}}.controls{{min-width:100px}}.foot{{flex-direction:column;gap:5px}}}}@media(max-width:370px){{.cards{{grid-template-columns:1fr}}}}
</style></head><body>
<main><header class="top"><div><div class="eyebrow">✳ 画里画外 · Beyond Canvas</div><h1>画室运行状态</h1><p>每一份创作背后的陪伴与支持。</p></div><div class="controls"><button class="refresh" id="refresh">↻ 刷新状态</button><span id="pulse" role="status" aria-live="polite">正在查看…</span></div></header>
<section class="stats"><div class="stat"><div class="statlabel">✳ 功能伙伴</div><div class="value" id="total">—</div><div class="statfoot">一起支持课堂创作</div></div><div class="stat"><div class="statlabel">✓ 本机已响应</div><div class="value green" id="local">—</div><div class="statfoot">已收到服务回应</div></div><div class="stat"><div class="statlabel">☁ 云端功能</div><div class="value" id="cloud">—</div><div class="statfoot">状态尚未检查</div></div><div class="stat"><div class="statlabel">◷ 等待回应</div><div class="value amber" id="attention">—</div><div class="statfoot">可能尚未开启</div></div></section>
<section id="components"><div class="sectionhead"><h2>画室的功能伙伴 <span class="micro" id="count"></span></h2><div class="filters" aria-label="筛选组件"><button class="filter selected" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="local" aria-pressed="false">本机</button><button class="filter" data-filter="cloud" aria-pressed="false">云端</button><button class="filter" data-filter="reserved" aria-pressed="false">暂未使用</button></div></div><div class="cards" id="board"><div class="empty">正在查看各项功能…</div></div></section>
<footer class="foot"><span>已响应表示服务可以连接；云端功能不会自动试用。详细说明可在卡片中展开。</span><details><summary>页面信息</summary><p>每 {seconds} 秒自动更新 · 当前端口 {port} · 配置 {profile}</p></details></footer></main>
<script>
const SECONDS={seconds};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}}[c]));
const names={{'vlm.studio':['看懂画作','eye','发现画里的细节，陪伴孩子表达。'],'vlm.director':['安心守护','shield','检查作品与回答，让交流更安心。'],'vlm.sketch':['素描识形','box','为本地素描重建辨认形体。'],'vlm.voice_lab':['语音实验室','chat','独立的成人语音对话试验。'],'image.edit':['画作动一动','spark','生成一张新的动作预览。'],'mesh.portrait':['素描立起来','box','把平面素描变成立体作品。'],'mesh.fast':['快速立体','box','保留的旧方案，课堂暂未使用。'],'mesh.premium':['精细立体','box','为后续创作准备的功能。'],'depth':['远近层次','layers','为后续空间理解准备的功能。'],'tts.studio':['开口陪伴','sound','用声音陪伴课堂中的交流。'],'tts.export':['故事朗读','book','把作品里的故事读出来。'],'speech.in':['听见想法','mic','把说出口的想法记成文字。'],'studio.page':['画室与作品集','gallery','开启课堂，收藏每一次创作。'],'safety.image':['作品守护','shield','在作品进入课堂前做安全检查。']}};
const drawings={{eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',box:'<path d="m12 3 9 5v9l-9 5-9-5V8Z M3 8l9 5 9-5 M12 13v9 M8 5l9 5"/>',chat:'<path d="M20 11a8 8 0 0 1-8 8H4l1-5a8 8 0 1 1 15-3Z"/><path d="M8 10h8 M8 14h4"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z M20 2v4 M18 4h4"/>',layers:'<path d="m12 3 10 6-10 6L2 9Z M2 13l10 6 10-6 M2 17l10 6 10-6"/>',sound:'<path d="m11 4-6 5H2v6h3l6 5Z M15 8a6 6 0 0 1 0 8 M18 5a10 10 0 0 1 0 14"/>',book:'<path d="M12 6v15 M12 6C9 3 5 3 2 4v15c4-1 7-1 10 2 3-3 6-3 10-2V4c-3-1-7-1-10 2Z"/>',mic:'<rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2 M12 19v3 M8 22h8"/>',gallery:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 6-6 4 4 3-3 5 5"/>'}};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(drawings[name]||drawings.spark)+'</svg>';
let lights=[],filter='all',busy=false;
function card(l){{const n=names[l.slot]||[l.slot,'spark','支持画室中的创作。'];const saved=l.usage==='仅保留配置';const status=saved?'暂未使用':l.hosted?'云端 · 未检查':l.up?'已响应':'等待回应';return `<article class="card"><div class="cardtop"><span class="icon">${{icon(n[1])}}</span><span class="status ${{saved?'saved':l.hosted?'':l.up?'ok':'off'}}">${{saved?'○':l.hosted?'☁':l.up?'✓':'◷'}} ${{status}}</span></div><h3>${{esc(n[0])}}</h3><p class="purpose">${{esc(n[2])}}</p><div class="cardmeta">${{l.usage==='独立实验'?'独立实验功能':saved?'当前课堂未使用':l.hosted?'通过云端提供支持':'在这台设备上运行'}}</div><details><summary>了解详情</summary><div class="model">模型：${{esc(l.model)}} · ${{esc(l.slot)}}</div><p>${{esc(l.purpose||'用途尚未核对')}}</p><p>${{esc(l.note||'服务已响应；不代表最近执行过任务。')}}</p><div class="resource">端口：${{l.port||'—'}} · 进程内存：${{l.ram_gb==null?'—':esc(l.ram_gb)+' GB'}} · 磁盘：${{l.disk_gb==null?'—':esc(l.disk_gb)+' GB'}}</div>${{l.size_gb?'<p>配置预算：'+esc(l.size_gb)+' GB（非实测）</p>':''}}${{l.clash?.length?'<p>端口共享需检查：'+l.clash.map(esc).join('、')+'</p>':''}}<p>未统计调用量、成功率或 GPU 利用率。共享服务的内存不可重复相加。</p></details></article>`;}}
function render(){{const rows=lights.filter(l=>filter==='all'||filter==='local'&&!l.hosted||filter==='cloud'&&l.hosted||filter==='reserved'&&l.usage==='仅保留配置');$('board').innerHTML=rows.map(card).join('')||'<div class="empty">此分类暂无组件。</div>';$('count').textContent=rows.length+' 项';}}
async function tick(){{if(busy)return;busy=true;$('refresh').disabled=true;try{{const r=await fetch('/api/lights',{{cache:'no-store',signal:AbortSignal.timeout(20000)}});if(!r.ok)throw Error('HTTP');const d=await r.json();lights=d.lights;const local=lights.filter(l=>!l.hosted);const endpoints=new Map(local.map(l=>[l.url||l.model,l]));$('total').textContent=lights.length;$('local').innerHTML=[...endpoints.values()].filter(l=>l.up).length+'<small>/ '+endpoints.size+' 服务</small>';$('cloud').textContent=lights.filter(l=>l.hosted).length;$('attention').textContent=[...endpoints.values()].filter(l=>l.up===false).length;$('pulse').textContent='● 最近检查 '+d.at;$('pulse').className='';render();}}catch(e){{$('pulse').textContent='刷新失败 · 保留上次数据';$('pulse').className='error';}}finally{{busy=false;$('refresh').disabled=false;}}}}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));}});render();}}));
$('refresh').addEventListener('click',tick);async function poll(){{await tick();setTimeout(poll,SECONDS*1000);}}poll();
</script><script defer src="/console.js"></script>
</body></html>
